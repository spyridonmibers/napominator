name: Сборка APK и IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Генерация android/ и ios/
        run: bash tool/setup_platforms.sh

      - name: Тесты логики
        run: flutter test

      # Чтобы обновления ставились поверх (без удаления и потери данных),
      # APK должен быть подписан одним и тем же ключом. См. README, шаг «Ключ».
      - name: Ключ подписи (если задан)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t"' | base64 -d > ~/.android/debug.keystore
            echo "Используется постоянный ключ"
          else
            echo "::warning::Секрет ANDROID_DEBUG_KEYSTORE_B64 не задан — каждая сборка подписана новым ключом"
          fi

      - name: Сборка APK
        run: flutter build apk --release

      - run: cp build/app/outputs/flutter-apk/app-release.apk napominator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: napominator.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Генерация android/ и ios/
        run: bash tool/setup_platforms.sh

      - name: Сборка iOS без подписи
        run: flutter build ios --release --no-codesign

      - name: Упаковка IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr napominator.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: napominator.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Напоминатор, сборка ${{ github.run_number }}
          files: |
            out/napominator.apk
            out/napominator.ipa
